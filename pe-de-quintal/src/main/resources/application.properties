spring.application.name=pedequintal

# 1. Carrega o arquivo .env da raiz do projeto (opcional em produção)
spring.config.import=optional:file:.env[.properties]

# 2. Conexão com o Supabase (PostgreSQL) usando as variáveis do .env
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${PDQ_DB_USERNAME}
spring.datasource.password=${PDQ_DB_PASSWORD}

# Pool pequeno: o plano gratuito do Supabase limita conexões
spring.datasource.hikari.maximum-pool-size=5

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# 4. Upload de 1 foto por anúncio (pasta local do servidor)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# 5. Dados de exemplo (usuários + anúncios) na primeira execução
app.dados-exemplo=${APP_DADOS_EXEMPLO:false}

# Sessão expira após 30 min sem uso
server.servlet.session.timeout=30m

# Deixa o Tomcat ler uploads grandes até o fim para podermos mostrar a mensagem amigável
server.tomcat.max-swallow-size=20MB
