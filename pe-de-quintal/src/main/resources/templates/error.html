<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ops! · Pé de Quintal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="pagina-auth">
<main class="auth">
    <section class="auth-card centro">
        <h1>🥕 Ops!</h1>
        <p th:if="${status == 404}">Página não encontrada.</p>
        <p th:if="${status == 403}">Você não tem permissão para fazer isso.</p>
        <p th:unless="${status == 404 or status == 403}">Algo deu errado. Tente novamente em instantes.</p>
        <a th:href="@{/itens}" class="botao botao-primario">Voltar para os itens</a>
    </section>
</main>
</body>
</html>
