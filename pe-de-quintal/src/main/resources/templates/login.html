<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="pagina-auth">

<main class="auth">
    <section class="auth-marca">
        <h1>🌱 Pé de Quintal</h1>
        <p class="slogan">Nada do seu quintal se perde.</p>
        <p>Troque e doe frutas, hortaliças, temperos e mudas cultivados em casa com seus vizinhos.</p>
    </section>

    <section class="auth-card">
        <h2>Entrar na sua conta</h2>

        <div th:replace="~{fragments/layout :: mensagens}"></div>
        <div class="alerta erro" th:if="${param.erro}">E-mail ou senha inválidos.</div>
        <div class="alerta sucesso" th:if="${param.saiu}">Você saiu da sua conta.</div>

        <!-- O POST /login é processado pelo Spring Security (SecurityConfig) -->
        <form th:action="@{/login}" method="post" class="formulario">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required autofocus>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>

            <button type="submit" class="botao botao-primario largo">Entrar</button>
        </form>

        <a th:href="@{/cadastro}" class="botao botao-secundario largo">Criar conta grátis</a>
    </section>
</main>

</body>
</html>
